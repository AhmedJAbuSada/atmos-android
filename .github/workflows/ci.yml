# Runs on every pull request and every push to main. Nothing merges with a red
# pipeline (NF-08). The same command works locally:
#   ./gradlew spotlessCheck lint test assembleDebug
name: CI

on:
  pull_request:
  push:
    # main, plus the tutorial's step branches, so every snapshot is verified too.
    branches: [main, "step-*"]

# A new push to the same branch cancels the previous run, which saves CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Validates the Gradle wrapper and caches dependencies between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Format (Spotless / ktlint)
        run: ./gradlew spotlessCheck

      - name: Locale-safe casing
        run: ./gradlew checkLocaleSafeCasing

      - name: Android Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew test

      - name: Coverage gates (domain ≥ 90%, data ≥ 80%)
        run: ./gradlew :domain:koverVerify :data:koverVerify

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Turns each failing test into an annotation on the run's summary page, so the
      # reason is visible without downloading the reports.
      - name: Annotate failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          # GitHub shows at most 10 annotations per step, so report each failing test
          # class once: its failure count and the first stack trace.
          failures = {}
          for path in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in list(case):
                      if problem.tag in ("failure", "error"):
                          failures.setdefault(case.get("classname"), []).append((case.get("name"), problem.text or ""))
          for test_class, cases in failures.items():
              name, trace = cases[0]
              text = f"{len(cases)} failing, first: {name}\n" + "\n".join(trace.splitlines()[:25])
              text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={test_class}::{text}")
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  # A real Android emulator: the end-to-end test against the real API, then a smoke test
  # of the shrunk (R8) release build. Slower, so it runs after the fast checks pass.
  device:
    name: Emulator tests and release smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./scripts/device-tests.sh

      - name: Annotate device failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          def emit(title, text):
              text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={title}::{text}")
          for path in glob.glob("app/build/outputs/androidTest-results/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in list(case):
                      if problem.tag in ("failure", "error"):
                          emit(case.get("classname"), "\n".join((problem.text or "").splitlines()[:25]))
          try:
              log = open("device.log", encoding="utf-8", errors="replace").read()
              match = re.search(r"What went wrong:(.{0,2500})", log, re.S)
              emit("Gradle", match.group(1) if match else "\n".join(log.splitlines()[-40:]))
          except FileNotFoundError:
              emit("Emulator", "No device.log: the emulator may not have started.")
          PY

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: device-reports
          path: app/build/reports/androidTests/
          retention-days: 7

  # Records the README screenshots when a commit message contains "[screenshots]", and
  # commits them back to the branch. Pushes made with GITHUB_TOKEN do not start new runs,
  # so this cannot loop.
  screenshots:
    name: Record screenshots
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[screenshots]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Record
        run: ./gradlew :app:testDebugUnitTest --tests "*ScreenshotTest" -PrecordScreenshots

      - name: Commit the images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "docs: update screenshots"
          git push

