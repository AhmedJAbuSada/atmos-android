# Runs on every pull request and every push to main. Nothing merges with a red
# pipeline (NF-08). The same command works locally:
#   ./gradlew spotlessCheck lint test assembleDebug
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the previous run, which saves CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Validates the Gradle wrapper and caches dependencies between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Format (Spotless / ktlint)
        run: ./gradlew spotlessCheck

      - name: Locale-safe casing
        run: ./gradlew checkLocaleSafeCasing

      - name: Android Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew test

      - name: Domain coverage ≥ 90%
        run: ./gradlew :domain:koverVerify

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
