# Runs on every pull request and every push to main. Nothing merges with a red
# pipeline (NF-08). The same command works locally:
#   ./gradlew spotlessCheck lint test assembleDebug
name: CI

on:
  pull_request:
  push:
    # main, plus the tutorial's step branches, so every snapshot is verified too.
    branches: [main, "step-*"]

# A new push to the same branch cancels the previous run, which saves CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Validates the Gradle wrapper and caches dependencies between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Format (Spotless / ktlint)
        run: ./gradlew spotlessCheck

      - name: Locale-safe casing
        run: ./gradlew checkLocaleSafeCasing

      - name: Android Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew test

      - name: Coverage gates (domain ≥ 90%, data ≥ 80%)
        run: ./gradlew :domain:koverVerify :data:koverVerify

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Turns each failing test into an annotation on the run's summary page, so the
      # reason is visible without downloading the reports.
      - name: Annotate failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in list(case):
                      if problem.tag in ("failure", "error"):
                          message = (problem.get("message") or problem.text or "")[:500]
                          message = message.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                          print(f"::error title={case.get('classname')}::{case.get('name')}: {message}")
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
