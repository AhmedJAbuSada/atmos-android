# Opens pull requests for dependency updates every week. Each one runs CI, so an
# update that breaks the build is caught before it is merged.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
